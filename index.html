<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOX - Elevate Your Gameplay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0c29 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 204, 0.05) 25%, rgba(0, 255, 204, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 204, 0.05) 75%, rgba(0, 255, 204, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 204, 0.05) 25%, rgba(0, 255, 204, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 204, 0.05) 75%, rgba(0, 255, 204, 0.05) 76%, transparent 77%, transparent);
            background-size: 60px 60px;
            z-index: 1;
            animation: scroll 30s linear infinite;
        }
        
        @keyframes scroll {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(60px);
            }
        }
        
        .container {
            text-align: center;
            z-index: 10;
            padding: 40px 20px;
            max-width: 600px;
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00ffcc, #ff006e, #00ffcc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
        }
        
        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        .tagline {
            font-size: 1.3rem;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 2px;
            animation: fadeInDelay 1.5s ease-in;
        }
        
        @keyframes fadeInDelay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            margin: 30px auto 50px;
            animation: expandWidth 1s ease-in;
        }
        
        @keyframes expandWidth {
            from {
                width: 0;
            }
            to {
                width: 80px;
            }
        }
        
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 15px;
            background: rgba(0, 255, 204, 0.05);
            border: 2px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        
        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.3), transparent);
            transition: left 0.5s;
            z-index: 0;
        }
        
        .social-link:hover::before {
            left: 100%;
        }
        
        .social-link:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5), inset 0 0 20px rgba(0, 255, 204, 0.1);
            transform: translateY(-5px);
        }
        
        .icon {
            font-size: 2.2rem;
            position: relative;
            z-index: 1;
        }
        
        .link-text {
            position: relative;
            z-index: 1;
        }
        
        .footer {
            margin-top: 60px;
            font-size: 0.9rem;
            color: rgba(0, 255, 204, 0.5);
            letter-spacing: 1px;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 3.5rem;
                letter-spacing: 3px;
            }
            
            .tagline {
                font-size: 1.1rem;
            }
            
            .links-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .social-link {
                padding: 15px 10px;
                font-size: 0.95rem;
            }
            
            .icon {
                font-size: 1.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo {
                font-size: 2.8rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .links-container {
                grid-template-columns: 1fr;
            }
            
            .social-link {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="container">
        <div class="logo">VELOX</div>
        <div class="divider"></div>
        <p class="tagline">Elevate Your Gameplay</p>
        
        <div class="links-container">
            <a href="https://velox-239.lovable.app/" target="_blank" class="social-link">
                <span class="icon">🌐</span>
                <span class="link-text">Website</span>
            </a>
            <a href="https://www.facebook.com/share/1EPEyB2P1v/" target="_blank" class="social-link">
                <span class="icon">👥</span>
                <span class="link-text">Facebook</span>
            </a>
            <a href="https://www.tiktok.com/@velox239?_r=1&_t=ZS-963nchJaGbl" target="_blank" class="social-link">
                <span class="icon">🎵</span>
                <span class="link-text">TikTok</span>
            </a>
            <a href="https://www.instagram.com/velox_239?igsh=MTZtanJ2MnRod3p4aA==" target="_blank" class="social-link">
                <span class="icon">📷</span>
                <span class="link-text">Instagram</span>
            </a>
        </div>
        
        <div class="footer">
            © 2026 VELOX | Gaming Elevated
        </div>
    </div>
</body>
</html>
